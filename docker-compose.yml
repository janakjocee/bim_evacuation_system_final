# Production-oriented Docker Compose configuration.

services:
  bim-evacuation:
    build:
      context: .
      dockerfile: Dockerfile
    image: bim-evacuation-system:latest
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
      - app-outputs:/app/outputs
      - app-logs:/app/logs
    environment:
      DEBUG: "false"
      LOG_LEVEL: INFO
      DATA_DIR: /app/data
      OUTPUT_DIR: /app/outputs
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  app-outputs:
  app-logs:
