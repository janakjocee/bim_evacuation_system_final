[server]
headless = true
maxUploadSize = 200
maxMessageSize = 200
enableCORS = true
enableXsrfProtection = true
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0B5F6B"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f7"
textColor = "#172033"
